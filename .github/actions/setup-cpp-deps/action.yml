name: "Set up C++ build deps"
description: >-
  Install the native build dependencies for the CPU build on an Ubuntu runner:
  apt packages, Drogon (built from source — not packaged), and the ONNX Runtime
  C++ SDK. Mirrors docker/Dockerfile.cpu so CI and the image agree.

runs:
  using: "composite"
  steps:
    - name: APT packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config \
          libopencv-dev libwebp-dev libturbojpeg0-dev \
          libgrpc++-dev libc-ares-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
          libjsoncpp-dev uuid-dev zlib1g-dev libssl-dev \
          git wget curl ca-certificates

    # Drogon is not an apt package; build the pinned release from source, exactly
    # as docker/Dockerfile.cpu does. Cached across runs by commit-independent key.
    - name: Cache Drogon
      id: drogon-cache
      uses: actions/cache@v4
      with:
        path: /usr/local
        key: drogon-v1.9.12-ort1.22.0-${{ runner.os }}-${{ runner.arch }}

    - name: Build + install Drogon v1.9.12
      if: steps.drogon-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd /tmp
        git clone --depth 1 --branch v1.9.12 https://github.com/drogonframework/drogon.git
        cd drogon && git submodule update --init
        mkdir build && cd build
        cmake .. -DBUILD_EXAMPLES=OFF -DBUILD_CTL=OFF -DBUILD_ORM=OFF \
                 -DBUILD_POSTGRESQL=OFF -DBUILD_MYSQL=OFF -DBUILD_SQLITE=OFF \
                 -DBUILD_REDIS=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
        make -j"$(nproc)"
        sudo make install

    # ONNX Runtime C++ SDK (amd64 runner). Pinned to match Dockerfile ORT_VERSION.
    - name: Install ONNX Runtime 1.22.0 (x64)
      if: steps.drogon-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd /tmp
        wget -q "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz" -O ort.tgz
        echo "8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3  ort.tgz" | sha256sum -c -
        tar xzf ort.tgz
        sudo cp -r onnxruntime-linux-x64-1.22.0/include/* /usr/local/include/
        sudo cp onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so* /usr/local/lib/

    # PDFium (vendored in third_party/) + fastpdf2png, for the pdf_renderer TU.
    # Vendored copy on amd64 — no network, fast — so run every time (not cached).
    - name: Install PDFium + fastpdf2png
      shell: bash
      run: |
        TARGETARCH=amd64 bash scripts/install_pdfium.sh
        sudo cp third_party/pdfium/lib/libpdfium.so /usr/lib/
        TARGETARCH=amd64 bash scripts/install_fastpdf2png.sh || true
        sudo cp bin/libpdfium.so /usr/lib/ 2>/dev/null || true

    - name: Refresh linker cache
      shell: bash
      run: sudo ldconfig
