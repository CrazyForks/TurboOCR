server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must match the server's MAX_BODY_MB so large scans aren't truncated here.
    client_max_body_size 100m;

    # Same-origin proxy: the browser only ever talks to this container, so the
    # TurboOCR server needs no CORS. The trailing slash strips the /api prefix:
    # /api/ocr/raw -> http://ocr:8000/ocr/raw, /api/capabilities -> /capabilities.
    location /api/ {
        proxy_pass http://ocr:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
